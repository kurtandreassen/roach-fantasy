<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roach Draft History</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>body{ overflow:auto; display:block; }</style>
</head>
<body>
<div class="hist-wrap">
  <p><a href="/" style="font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--accent);">&larr; Back to Draft Board</a></p>
  <h1>Five Years of Roach Drafts</h1>
  <p style="color:var(--muted);">Pulled from CBS's own draft-history archive. See how well draft order predicts outcome, and how Kurt's own picks have held up.</p>

  <h2>Draft order vs. season outcome</h2>
  <div class="stat-row" id="corr-stats"></div>

  <h2>Kurt's round-by-round performance vs. the field</h2>
  <div class="tbl-wrap" style="overflow-x:auto; border:1px solid var(--line); border-radius:6px;">
    <table style="width:100%; border-collapse:collapse; font-size:0.92rem;">
      <thead>
        <tr>
          <th style="text-align:left; padding:9px 12px; background:var(--surface2); border-bottom:1px solid var(--line); font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase;">Round</th>
          <th style="text-align:right; padding:9px 12px; background:var(--surface2); border-bottom:1px solid var(--line); font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase;">Kurt Avg</th>
          <th style="text-align:right; padding:9px 12px; background:var(--surface2); border-bottom:1px solid var(--line); font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase;">Field Avg</th>
          <th style="text-align:right; padding:9px 12px; background:var(--surface2); border-bottom:1px solid var(--line); font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase;">vs. Field</th>
        </tr>
      </thead>
      <tbody id="round-tbl"></tbody>
    </table>
  </div>
</div>

<script>
async function load() {
  const corrRes = await fetch('/api/history/correlation');
  const corr = await corrRes.json();
  const corrEl = document.getElementById('corr-stats');
  corrEl.innerHTML = Object.entries(corr).map(([year, rho]) => `
    <div class="stat"><div class="k">${year}</div><div class="v">${rho != null ? rho.toFixed(2) : 'n/a'}</div></div>
  `).join('');

  const roundsRes = await fetch('/api/history/kurt-rounds');
  const rounds = await roundsRes.json();
  const tbody = document.getElementById('round-tbl');
  tbody.innerHTML = rounds.map(r => {
    const cls = r.diffPct >= 0 ? 'gap-pos' : 'gap-neg';
    return `<tr>
      <td style="padding:8px 12px; border-bottom:1px solid var(--line-soft);">R${r.round}</td>
      <td class="num" style="padding:8px 12px; border-bottom:1px solid var(--line-soft); text-align:right;">${r.managerAvg}</td>
      <td class="num" style="padding:8px 12px; border-bottom:1px solid var(--line-soft); text-align:right;">${r.fieldAvg}</td>
      <td class="num ${cls}" style="padding:8px 12px; border-bottom:1px solid var(--line-soft); text-align:right;">${r.diffPct > 0 ? '+' : ''}${r.diffPct}%</td>
    </tr>`;
  }).join('');
}
load();
</script>
</body>
</html>
