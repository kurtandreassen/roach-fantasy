<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brighton Roach — VOR War Room</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --border: #2a2f3a;
    --text: #e8eaed;
    --muted: #8b93a3;
    --muted-2: #5b6272;
    --accent: #f5c518;
    --win: #3ecf8e;
    --loss: #e5544d;
    --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --font-body: "Inter", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    margin: 0;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .title-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .badge {
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: 0.08em;
    font-size: 12.5px;
    background: var(--accent);
    color: #171308;
    padding: 3px 9px;
    border-radius: 4px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 21px;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .sub {
    color: var(--muted);
    font-size: 12.5px;
    margin: 0;
  }
  .sub.error { color: var(--loss); }
  .sub .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--win); margin-right: 5px; }
  .sub.loading .dot { background: var(--muted-2); }
  .sub.error .dot { background: var(--loss); }
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  #search {
    flex: 1;
    min-width: 160px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13.5px;
    font-family: inherit;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  .chip {
    background: var(--panel-2);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.active { background: var(--accent); color: #171308; border-color: var(--accent); }
  .chip.hide-taken { margin-left: auto; }
  .chip.hide-taken.active { background: var(--win); border-color: var(--win); color: #0f1a14; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 0 18px 40px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }

  .col-heads {
    position: sticky;
    top: 0;
    display: grid;
    grid-template-columns: 34px 1fr 54px 90px 60px 44px;
    gap: 8px;
    padding: 10px 8px 8px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted-2);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .col-heads span.num { text-align: right; }

  .row {
    display: grid;
    grid-template-columns: 34px 1fr 54px 90px 60px 44px;
    gap: 8px;
    align-items: center;
    padding: 9px 8px;
    border-bottom: 1px solid rgba(42, 47, 58, 0.55);
    cursor: pointer;
  }
  .row:hover { background: var(--panel-2); }
  .rank {
    font-family: var(--font-mono);
    color: var(--muted-2);
    font-size: 12px;
  }
  .name-cell { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .name {
    font-weight: 500;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .team { color: var(--muted-2); font-size: 11.5px; flex-shrink: 0; }
  .pos-tag {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    color: #14161c;
    letter-spacing: 0.02em;
    text-align: center;
  }
  .pos-QB { background: #b39ddb; } .pos-RB { background: var(--win); } .pos-WR { background: var(--accent); }
  .pos-TE { background: #6db3e0; } .pos-K { background: #c9a4a0; } .pos-DST { background: var(--muted); }

  .vor-cell { display: flex; align-items: center; gap: 8px; }
  .vor-bar-track { width: 44px; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; flex-shrink: 0; }
  .vor-bar-fill { height: 100%; border-radius: 3px; background: var(--win); }
  .vor-bar-fill.neg { background: var(--loss); }
  .vor-val { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; }
  .vor-val.neg { color: var(--muted-2); }

  .proj, .bye {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--muted);
    text-align: right;
  }

  .row.taken { opacity: 0.35; }
  .row.taken .name { text-decoration: line-through; text-decoration-color: var(--muted-2); }

  .tier-divider {
    padding: 10px 8px 4px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted-2);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tier-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .empty { padding: 30px 8px; color: var(--muted); font-size: 13px; text-align: center; }

  .flag-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 4px;
    letter-spacing: 0.02em;
    flex-shrink: 0;
    cursor: help;
  }
  .flag-danger { background: var(--loss); color: #2a0d0b; }
  .flag-warn { background: var(--accent); color: #171308; }
  .flag-info { background: var(--muted-2); color: #14161c; }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

  @media (max-width: 520px) {
    .col-heads, .row { grid-template-columns: 26px 1fr 48px 0 50px 0; }
    .proj, .bye { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <span class="badge">ROACH</span>
    <h1>VOR War Room</h1>
    <span class="sub loading" id="syncStatus"><span class="dot"></span>Loading board…</span>
  </div>
  <div class="controls">
    <input type="text" id="search" placeholder="Search player or team…">
    <button class="chip active" data-pos="ALL">All</button>
    <button class="chip" data-pos="QB">QB</button>
    <button class="chip" data-pos="RB">RB</button>
    <button class="chip" data-pos="WR">WR</button>
    <button class="chip" data-pos="TE">TE</button>
    <button class="chip" data-pos="K">K</button>
    <button class="chip" id="refreshBtn">Refresh</button>
    <button class="chip hide-taken" id="hideTaken">Hide taken</button>
  </div>
</header>

<main>
  <div class="col-heads">
    <span>#</span>
    <span>Player</span>
    <span></span>
    <span class="num" title="Recomputes against the undrafted pool every time you mark someone Taken.">VOR·live</span>
    <span class="num">Proj</span>
    <span class="num">Bye</span>
  </div>
  <div id="list"></div>
</main>

<script>
(function () {
  const TOP_N = 200;

  let rawPlayers = [];
  let players = [];
  let maxVor = 1;
  let newsFlags = {};

  // Recomputes VOR against the CURRENT undrafted pool: replacement level for
  // each position is the Nth-best projection among players NOT YET TAKEN at
  // that position (N = that position's fixed replacement slot count), not
  // the Nth-best overall. Mutates rawPlayers in place.
  function recomputeDynamicVor() {
    const byPos = {};
    rawPlayers.forEach((p) => {
      if (p.proj == null) return;
      (byPos[p.pos] = byPos[p.pos] || []).push(p);
    });
    const replacementProj = {};
    Object.keys(byPos).forEach((pos) => {
      const undraftedProj = byPos[pos]
        .filter((p) => !taken.has(p.name))
        .map((p) => p.proj)
        .sort((a, b) => b - a);
      const repCount = byPos[pos][0].replacement || undraftedProj.length;
      replacementProj[pos] = undraftedProj[Math.min(repCount - 1, undraftedProj.length - 1)] ?? 0;
    });
    rawPlayers.forEach((p) => {
      p.vor = p.proj != null && replacementProj[p.pos] != null
        ? Math.round((p.proj - replacementProj[p.pos]) * 100) / 100
        : p.staticVor;
    });
  }

  function rebuildDisplayList() {
    const sorted = rawPlayers
      .filter((p) => p.vor != null)
      .sort((a, b) => b.vor - a.vor)
      .slice(0, TOP_N);
    players = sorted.map((p, i) => ({
      rank: i + 1,
      name: p.name,
      pos: p.pos,
      team: p.team,
      vor: Math.round(p.vor * 10) / 10,
      proj: Math.round(p.proj * 10) / 10,
      tier: p.tier,
      bye: p.bye,
    }));
    maxVor = Math.max(...players.map((p) => p.vor), 1);
  }

  async function loadNewsFlags() {
    try {
      const res = await fetch('/api/news-flags', { cache: 'no-store' });
      if (!res.ok) return;
      const body = await res.json();
      const map = {};
      (body.flags || []).forEach((f) => { map[f.name] = f; });
      newsFlags = map;
    } catch (e) { /* non-fatal, board still usable without flags */ }
  }

  let taken = new Set();
  try { taken = new Set(JSON.parse(localStorage.getItem('vor_war_room_taken') || '[]')); } catch (e) {}
  function saveTaken() {
    try { localStorage.setItem('vor_war_room_taken', JSON.stringify([...taken])); } catch (e) {}
  }

  const state = { q: '', pos: 'ALL', hideTaken: false };

  function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function setStatus(kind, text) {
    const el = document.getElementById('syncStatus');
    el.className = 'sub ' + kind;
    el.innerHTML = '<span class="dot"></span>' + esc(text);
  }

  async function loadBoard() {
    setStatus('loading', 'Syncing board…');
    try {
      const res = await fetch('/api/board', { cache: 'no-store' });
      if (!res.ok) throw new Error('Board API returned ' + res.status);
      const body = await res.json();
      const board = Array.isArray(body) ? body : body.players;
      rawPlayers = board;
      rawPlayers.forEach((p) => { p.staticVor = p.vor; });
      recomputeDynamicVor();
      rebuildDisplayList();
      const now = new Date();
      setStatus('', board.length + ' players · synced ' + now.toLocaleTimeString());
      render();
    } catch (err) {
      setStatus('error', 'Could not load the board (' + err.message + ').');
    }
  }

  document.getElementById('refreshBtn').addEventListener('click', () => { loadNewsFlags(); loadBoard(); });

  function render() {
    const q = state.q.trim().toLowerCase();
    const filtered = players.filter((p) => {
      if (state.pos !== 'ALL' && p.pos !== state.pos) return false;
      if (state.hideTaken && taken.has(p.name)) return false;
      if (q && !p.name.toLowerCase().includes(q) && !p.team.toLowerCase().includes(q)) return false;
      return true;
    });

    if (!filtered.length) {
      document.getElementById('list').innerHTML = '<div class="empty">No players match.</div>';
      return;
    }

    let html = '';
    let lastTier = null;
    filtered.forEach((p) => {
      if (state.q === '' && p.tier !== lastTier) {
        html += `<div class="tier-divider">Tier ${p.tier}</div>`;
        lastTier = p.tier;
      }
      const barPct = Math.max(2, Math.round((Math.abs(p.vor) / maxVor) * 100));
      const isTaken = taken.has(p.name);
      const flag = newsFlags[p.name];
      const flagHtml = flag
        ? `<span class="flag-tag flag-${flag.level}" title="${esc(flag.note)}">${esc(flag.tag)}</span>`
        : '';
      html += `
        <div class="row ${isTaken ? 'taken' : ''}" data-name="${esc(p.name)}">
          <span class="rank">${p.rank}</span>
          <div class="name-cell">
            <span class="pos-tag pos-${p.pos}">${p.pos}</span>
            <span class="name">${esc(p.name)}</span>
            <span class="team">${esc(p.team)}</span>
            ${flagHtml}
          </div>
          <span></span>
          <span class="vor-cell">
            <span class="vor-bar-track"><span class="vor-bar-fill ${p.vor < 0 ? 'neg' : ''}" style="width:${barPct}%"></span></span>
            <span class="vor-val ${p.vor < 0 ? 'neg' : ''}">${p.vor > 0 ? '+' : ''}${p.vor}</span>
          </span>
          <span class="proj">${p.proj}</span>
          <span class="bye">${p.bye ?? '—'}</span>
        </div>`;
    });
    document.getElementById('list').innerHTML = html;
  }

  document.getElementById('search').addEventListener('input', (e) => { state.q = e.target.value; render(); });
  document.querySelectorAll('.chip[data-pos]').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.chip[data-pos]').forEach((b) => b.classList.toggle('active', b === btn));
      state.pos = btn.dataset.pos;
      render();
    });
  });
  const hideTakenBtn = document.getElementById('hideTaken');
  hideTakenBtn.addEventListener('click', () => {
    state.hideTaken = !state.hideTaken;
    hideTakenBtn.classList.toggle('active', state.hideTaken);
    render();
  });
  document.getElementById('list').addEventListener('click', (e) => {
    const row = e.target.closest('.row');
    if (!row) return;
    const name = row.dataset.name;
    if (taken.has(name)) taken.delete(name); else taken.add(name);
    saveTaken();
    recomputeDynamicVor();
    rebuildDisplayList();
    render();
  });

  loadNewsFlags().then(loadBoard);
})();
</script>
</body>
</html>
